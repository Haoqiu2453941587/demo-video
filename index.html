<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品集合</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    main { width: min(100%, 1000px); }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 20px; }
    video { display: block; width: 100%; max-height: 80vh; background: #000; }
  </style>
</head>
<body>
  <main>
    <h1>作品集合</h1>
    <video controls playsinline preload="metadata">
      <source src="video.mp4" type="video/mp4">
      您的浏览器不支持视频播放。
    </video>
  </main>
</body>
</html>
